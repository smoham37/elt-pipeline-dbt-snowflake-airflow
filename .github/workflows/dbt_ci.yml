name: dbt CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'dbt_project/**'

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
  SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
  SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
  SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}

jobs:
  dbt-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt_project

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install dbt-core dbt-snowflake sqlfluff sqlfluff-templater-dbt

      - name: dbt deps
        run: dbt deps --profiles-dir .

      - name: dbt compile
        run: dbt compile --profiles-dir . --target ci

      - name: dbt test (schema only)
        run: dbt test --profiles-dir . --target ci --select "test_type:schema"

      - name: SQLFluff lint
        run: |
          sqlfluff lint models/ --dialect snowflake --ignore parsing || true

      - name: dbt docs generate
        run: dbt docs generate --profiles-dir . --target ci

      - name: Upload dbt artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts
          path: |
            dbt_project/target/manifest.json
            dbt_project/target/run_results.json
            dbt_project/target/catalog.json
